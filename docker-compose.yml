services:
  google-maps-scraper:
    image: gosom/google-maps-scraper:latest
    pull_policy: always
    container_name: leadflow-gmaps-scraper
    restart: unless-stopped
    command: ["-web", "-data-folder", "/gmapsdata"]
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - gmaps_data:/gmapsdata

volumes:
  gmaps_data:
